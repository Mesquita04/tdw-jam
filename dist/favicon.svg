<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#00f3ff" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Container with neon cyber border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Terminal Top Bar -->
  <line x1="2" y1="18" x2="62" y2="18" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="11" cy="10" r="2.5" fill="#f43f5e" />
  <circle cx="18" cy="10" r="2.5" fill="#eab308" />
  <circle cx="25" cy="10" r="2.5" fill="#10b981" />

  <!-- Mini TDW text badge in top right -->
  <text x="52" y="13" fill="#64748b" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="7" font-weight="bold" text-anchor="end">TDW</text>

  <!-- Center Code Brackets: < / > -->
  <!-- Left Bracket < -->
  <path d="M 23 27 L 13 37 L 23 47" fill="none" stroke="#00f3ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Slash / -->
  <path d="M 35 25 L 29 49" fill="none" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round" />

  <!-- Right Bracket > -->
  <path d="M 41 27 L 51 37 L 41 47" fill="none" stroke="#00f3ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>
